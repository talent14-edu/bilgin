<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ders durağı · BİLGİN</title>
<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="../iop/iop.css">
<link rel="stylesheet" href="mobil.css">
<style>
#iop{--io-ust:0px;height:auto;max-height:none;min-height:0;background:transparent;overflow:visible}
#iop .io-ic{padding:0}#iop .io-ust{display:none}.back{display:inline-flex;align-items:center}.lesson{padding-bottom:36px}.lesson h1{margin:5px 0 18px}.lesson img{max-width:100%}.lesson .io-adim{min-height:44px}
</style>
<header><img class="logo" src="../assets/logo.png" alt="Bilgin"><a class="back" id="back" href="index.html">← Defterim</a></header>
<main class="lesson"><p id="context" class="meta"></p><h1 id="topic"></h1><details class="guide"><summary>Bu durakta neler var?</summary><div id="guideContent" class="guideGrid"></div></details><section id="iop" class="iop iop-bolum" aria-label="Ders etkinliği"></section><form class="sheet journal" id="notum"><label for="note">Defterime not</label><textarea id="note" rows="3" maxlength="1500" placeholder="Bu konuda ne keşfettin? Bir örnek yaz."></textarea><div><button class="primary" type="submit">Notumu kaydet</button><span role="status" id="noteStatus"></span></div><small>Bu tarayıcıda saklanır.</small></form></main>
<script src="notlar.js"></script><script src="../iop/icerik.js"></script><script src="../iop/iop.js"></script>
<script>
const params=new URLSearchParams(location.search);
const key=params.get('k')+'|'+params.get('d');
const [grade,subject]=(Object.hasOwn(IOP_DERS,key)?key:'5|Fen Bilimleri').split('|');
const lesson=IOP_DERS[grade+'|'+subject];
const home='index.html?k='+grade;
document.getElementById('back').href=home;
document.getElementById('context').textContent=grade+'. sınıf · '+subject;
document.getElementById('topic').textContent=lesson.konu;
const note=document.querySelector('#note');
note.value=readLessonNote(grade,subject);
document.querySelector('#notum').onsubmit=event=>{
  event.preventDefault();
  const message=document.querySelector('#noteStatus');
  try{
    const key=lessonNoteKey(grade,subject);
    if(note.value.trim())localStorage.setItem(key,note.value.trim());
    else localStorage.removeItem(key);
    message.textContent=note.value.trim()?'Defterine kaydedildi.':'Not temizlendi.';
  }catch{message.textContent='Bu tarayıcı notu kaydedemedi.'}
};
if(location.hash==='#notum')requestAnimationFrame(()=>note.focus());
function saveResult(result){
  try{localStorage.setItem('bilgin.mobil.'+grade+'|'+subject,JSON.stringify(result))}
  catch{document.querySelector('.io-sonuc .io-konu').textContent='Bu tarayıcı sonucu kaydedemedi.'}
}
document.querySelector('#guideContent').innerHTML=`<div><h2>İzle</h2><p>${lesson.v.length} sahnede ${lesson.konu.toLocaleLowerCase('tr')}.</p></div><div><h2>${lesson.oyun.ad}</h2><p>${lesson.oyun.yonerge}</p></div><div><h2>Ölç</h2><p>${lesson.test.length} soruda ${lesson.beceri.map(b=>b.toLocaleLowerCase('tr')).join(', ')}.</p></div>`;
const engine=IOP.kur(document.getElementById('iop'),{kok:'../',sinif:Number(grade),ders:subject,haritaLink:home+'#harita',testBitti:saveResult});
if(params.get('adim')==='oyna')engine.git('oyna',true);
</script>
</html>
